paths:
  /slots:
    get:
      operationId: listSlots
      parameters:
        - in: query
          name: date_from
          schema: { type: string, format: date-time }
        - in: query
          name: date_to
          schema: { type: string, format: date-time }
        - in: query
          name: format_id
          schema: { type: string }
        - in: query
          name: instructor_id
          schema: { type: string }
        - in: query
          name: only_available
          schema: { type: boolean }
      responses:
        '200':
          description: Slot list
          content:
            application/json:
              schema:
                $ref: './models.yaml#/components/schemas/SlotListResponse'
  /slots/{slot_id}:
    get:
      operationId: getSlot
      parameters:
        - in: path
          name: slot_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Slot
          content:
            application/json:
              schema:
                $ref: './models.yaml#/components/schemas/Slot'

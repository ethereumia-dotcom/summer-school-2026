components:
  schemas:
    SlotListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
    Slot:
      type: object
      required: [id, start_at, status, format, instructor, total_seats, free_seats, free_rental_sets, price, rental_price, address]
      properties:
        id: { type: string }
        start_at: { type: string, format: date-time }
        status:
          type: string
          enum: [scheduled, cancelled]
        format:
          $ref: '#/components/schemas/TrainingFormat'
        instructor:
          $ref: '#/components/schemas/Instructor'
        total_seats: { type: integer }
        free_seats: { type: integer }
        free_rental_sets: { type: integer }
        rental_price:
          $ref: '../common/models.yaml#/components/schemas/Money'
        price:
          $ref: '../common/models.yaml#/components/schemas/Money'
        address: { type: string }
        cancellation_reason: { type: string, nullable: true }
    TrainingFormat:
      type: object
      required: [id, name, type, capacity_cap, duration_min]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [novice, experienced] }
        capacity_cap: { type: integer }
        duration_min: { type: integer }
    Instructor:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

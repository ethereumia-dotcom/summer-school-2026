components:
  schemas:
    CreateBookingRequest:
      type: object
      required: [slot_id, seats_count, rental_count]
      properties:
        slot_id: { type: string }
        seats_count: { type: integer, minimum: 1, maximum: 3 }
        rental_count: { type: integer, minimum: 0 }
    BookingListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
    Booking:
      type: object
      required: [id, slot_id, seats_count, rental_count, status, total_price, created_at]
      properties:
        id: { type: string }
        slot_id: { type: string }
        seats_count: { type: integer }
        rental_count: { type: integer }
        status:
          type: string
          enum: [active, cancelled_by_client, late_cancelled, cancelled_by_club, completed]
        cancellation_reason: { type: string, nullable: true }
        total_price:
          $ref: '../common/models.yaml#/components/schemas/Money'
        created_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time, nullable: true }

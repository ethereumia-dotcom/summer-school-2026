paths:
  /bookings:
    get:
      operationId: listBookings
      responses:
        '200':
          description: Booking list
          content:
            application/json:
              schema:
                $ref: './models.yaml#/components/schemas/BookingListResponse'
    post:
      operationId: createBooking
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './models.yaml#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: './models.yaml#/components/schemas/Booking'
        '409':
          description: Slot is full or cancelled
          content:
            application/json:
              schema:
                $ref: '../common/models.yaml#/components/schemas/Error'
        '410':
          description: Rental equipment unavailable
          content:
            application/json:
              schema:
                $ref: '../common/models.yaml#/components/schemas/Error'
  /bookings/{booking_id}:
    get:
      operationId: getBooking
      parameters:
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: './models.yaml#/components/schemas/Booking'
  /bookings/{booking_id}/cancel:
    post:
      operationId: cancelBooking
      parameters:
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: './models.yaml#/components/schemas/Booking'
        '409':
          description: Booking cannot be cancelled by current rule
          content:
            application/json:
              schema:
                $ref: '../common/models.yaml#/components/schemas/Error'

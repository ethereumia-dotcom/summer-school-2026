paths:
  /auth/request-otp:
    post:
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './models.yaml#/components/schemas/RequestOtpRequest'
      responses:
        '202':
          description: OTP sent
  /auth/confirm-otp:
    post:
      operationId: confirmOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './models.yaml#/components/schemas/ConfirmOtpRequest'
      responses:
        '200':
          description: Auth tokens
          content:
            application/json:
              schema:
                $ref: './models.yaml#/components/schemas/AuthTokens'
  /auth/refresh:
    post:
      operationId: refreshToken
      responses:
        '200':
          description: Refreshed token

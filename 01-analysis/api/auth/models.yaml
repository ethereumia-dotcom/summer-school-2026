components:
  schemas:
    RequestOtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
    ConfirmOtpRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { type: string }
        code: { type: string }
    AuthTokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
